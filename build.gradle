plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

// ──────────────────────────────────────────────
// Root project is NOT a runnable application.
// It only manages shared config for all subprojects.
// ──────────────────────────────────────────────
bootJar.enabled = false
jar.enabled = true

allprojects {
    group = 'com.authenza'
    version = '1.0.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    // All subprojects inherit the Spring Boot BOM for consistent dependency versions
    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:3.5.7"
        }
    }

    dependencies {
        // Common test dependency for all modules
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
    }

    test {
        useJUnitPlatform()
    }
}

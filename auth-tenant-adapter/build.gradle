plugins {
    id 'java-library'
}

dependencies {
    // Shared DTOs, events, and enums
    api project(':auth-common')

    // JDBC + HikariCP (exposed as api so consuming services get it transitively)
    api 'org.springframework.boot:spring-boot-starter-data-jdbc'

    // Redis Pub/Sub for dynamic tenant provisioning events
    api 'org.springframework.boot:spring-boot-starter-data-redis'

    // Spring WebMVC for tenant-aware interceptors
    implementation 'org.springframework:spring-webmvc'

    // Servlet API (provided at runtime by the embedded container)
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.1.0'

    // Database Drivers — exposed as runtimeOnly so all consuming services
    // can connect to any supported tenant DB without re-declaring drivers
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.oracle.database.jdbc:ojdbc8'
}
plugins {
    id 'java-library'
}

dependencies {
    // Shared module
    implementation project(':auth-common')

    // JDBC + HikariCP (HikariCP is included transitively)
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'

    // Redis Pub/Sub for dynamic tenant provisioning events
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // Jackson (used directly by TenantProvisionedListener for JSON deserialization)
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // Spring WebMVC for tenant-aware filters/interceptors
    implementation 'org.springframework:spring-webmvc'

    // Servlet API (compile-only, provided by the runtime container)
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.1.0'

    // Database Drivers: support all tenant DB types
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.oracle.database.jdbc:ojdbc8'
}
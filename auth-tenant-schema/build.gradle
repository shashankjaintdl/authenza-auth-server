plugins {
    id 'java-library'
    id 'org.liquibase.gradle' version '2.2.0'
}

dependencies {
    // Liquibase for programmatic schema migrations (used at compile time)
    implementation 'org.liquibase:liquibase-core'

    // ── Liquibase Gradle Plugin Runtime ──
    liquibaseRuntime 'org.liquibase:liquibase-core:4.24.0'
    liquibaseRuntime 'info.picocli:picocli:4.7.5'
    liquibaseRuntime 'com.mysql:mysql-connector-j:8.0.33'
}

// ──────────────────────────────────────────────
// Custom task: generate a clean SQL file by stripping
// Liquibase tracking/locking metadata from updateSql output
// ──────────────────────────────────────────────
tasks.register('generateMigrationScript') {
    group = 'liquibase'
    description = 'Generates a clean SQL file without DATABASECHANGELOG or Locking statements.'

    dependsOn 'updateSql'

    doLast {
        def sqlFile = project.file("build/reports/liquibase/master_update.sql")

        if (!sqlFile.exists()) {
            throw new GradleException("ERROR: Could not find the generated SQL file at ${sqlFile.path}. " +
                    "Ensure 'outputFile' is set in your master activity.")
        }

        println "──────────────────────────────────────────"
        println "PROCESS: Cleaning Liquibase metadata from: ${sqlFile.path}"

        def cleanLines = sqlFile.readLines().findAll { line ->
            String upper = line.toUpperCase()
            !(upper.contains("DATABASECHANGELOG") ||
              upper.contains("DATABASECHANGELOGLOCK") ||
              upper.contains("RELEASE DATABASE LOCK") ||
              upper.contains("LOCK GRANTED"))
        }

        sqlFile.text = cleanLines.join("\n").replaceAll("(?m)^\\s*\n", "")

        println "SUCCESS: Generated clean SQL containing only business DDL."
        println "LOCATION: ${sqlFile.absolutePath}"
        println "──────────────────────────────────────────"
    }
}

liquibase {
    activities {
        master {
            changelogFile "/auth-tenant-schema/src/main/resources/db/changelog/master/db.changelog-master.xml"
            url System.getenv("MASTER_DB_URL") ?: 'jdbc:mysql://localhost:3306/auth-master'
            username System.getenv("MASTER_DB_USER") ?: 'root'
            password System.getenv("MASTER_DB_PASS") ?: 'sjain@123'
            driver "com.mysql.cj.jdbc.Driver"
            outputFile 'auth-tenant-schema/build/reports/liquibase/master_update.sql'
            logLevel 'info'
            logFile 'auth-tenant-schema/build/reports/liquibase/liquibase.log'
        }
    }
}
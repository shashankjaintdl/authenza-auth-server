plugins {
    id 'java-library'
    id 'org.liquibase.gradle' version '2.2.0'
}

dependencies {
    // Liquibase for programmatic schema migrations (used at compile time)
    implementation 'org.liquibase:liquibase-core'

    // ── Liquibase Gradle Plugin Runtime ──
    liquibaseRuntime 'org.liquibase:liquibase-core:4.24.0'
    liquibaseRuntime 'info.picocli:picocli:4.7.5'
    liquibaseRuntime 'com.mysql:mysql-connector-j:8.0.33'
}

import org.gradle.api.tasks.JavaExec

// Register a task that iterates through all XMLs and calls javaexec to liquibase
tasks.register('generateMigrationScripts') {
    group = 'liquibase'
    description = 'Generates individual SQL files mirroring the XML tree'

    def changelogDir = project.file('src/main/resources/db/changelog')
    def outDir = project.file('build/reports/liquibase')

    doLast {
        def cp = project.configurations.liquibaseRuntime
        
        fileTree(dir: changelogDir, include: '**/*.xml', exclude: '**/db.changelog*.xml').each { File file ->
            def relativePath = changelogDir.toPath().relativize(file.toPath()).toString()
            def outSqlPath = new File(outDir, relativePath.replace('.xml', '.sql'))
            
            // Ensure parent dirs exist
            outSqlPath.parentFile.mkdirs()

            // Delete the offline tracking CSV so Liquibase thinks the DB is always blank
            def csvState = project.file('databasechangelog.csv')
            if (csvState.exists()) csvState.delete()

            println "- Generating SQL for ${relativePath} -> ${outSqlPath.absolutePath}"
            
            project.javaexec {
                classpath = cp + project.files('src/main/resources')
                mainClass = 'liquibase.integration.commandline.Main'
                args = [
                    "--url=offline:mysql",
                    "--changeLogFile=db/changelog/${relativePath}",
                    "updateSQL"
                ]
                standardOutput = new FileOutputStream(outSqlPath)
            }

            // Cleanup the file metadata
            def cleanLines = outSqlPath.readLines().findAll { line ->
                String upper = line.toUpperCase()
                !(upper.contains("DATABASECHANGELOG") ||
                  upper.contains("DATABASECHANGELOGLOCK") ||
                  upper.contains("RELEASE DATABASE LOCK") ||
                  upper.contains("LOCK GRANTED"))
            }
            outSqlPath.text = cleanLines.join("\n").replaceAll("(?m)^\\s*\n", "")
        }
        println "DONE! Check build/reports/liquibase/"
    }
}

// Keep the standard master definition available if needed
liquibase {
    activities {
        master {
            changelogFile "src/main/resources/db/changelog/master/db.changelog-master.xml"
            url System.getenv("MASTER_DB_URL") ?: 'jdbc:mysql://localhost:3306/auth-master'
            username System.getenv("MASTER_DB_USER") ?: 'root'
            password System.getenv("MASTER_DB_PASS") ?: 'sjain@123'
            driver "com.mysql.cj.jdbc.Driver"
            outputFile 'build/reports/liquibase/master_update.sql'
            logLevel 'info'
            logFile 'build/reports/liquibase/liquibase.log'
        }
    }
}
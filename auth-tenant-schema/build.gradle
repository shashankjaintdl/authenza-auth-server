dependencies {

    // 1. Standard project dependencies for your code
    implementation 'org.liquibase:liquibase-core:4.24.0'

    // 2. Plugin-specific dependencies (REQUIRED for Gradle tasks)
    liquibaseRuntime 'org.liquibase:liquibase-core:4.24.0'
    liquibaseRuntime 'info.picocli:picocli:4.7.5'
    // Required for YAML/JSON changelog support
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // Database Drivers for provisioning
    liquibaseRuntime 'com.mysql:mysql-connector-j:8.0.33'
//    runtimeOnly 'com.mysql:mysql-connector-j'
//    runtimeOnly 'org.postgresql:postgresql'
//    runtimeOnly 'com.oracle.database.jdbc:ojdbc8'
}

/**
 * Custom task to generate a "Clean" SQL file by stripping out
 * Liquibase-specific tracking and locking metadata.
 */
tasks.register('generateMigrationScript') {
    group = 'liquibase'
    description = 'Generates a clean SQL file without DATABASECHANGELOG or Locking statements.'

    // Ensure updateSql runs first to generate the raw file
    dependsOn 'updateSql'

    doLast {
        // Resolve the file path relative to this specific module
        def sqlFilePath = "build/reports/liquibase/master_update.sql"
        def sqlFile = project.file(sqlFilePath)

        if (sqlFile.exists()) {
            println "------------------------------------------------------------"
            println "PROCESS: Cleaning Liquibase metadata from: ${sqlFile.path}"

            def lines = sqlFile.readLines()

            // Filter logic: Remove any line containing tracking or locking keywords
            def cleanLines = lines.findAll { line ->
                String upperLine = line.toUpperCase()

                // Exclude tracking tables and lock management
                boolean isMetadata = upperLine.contains("DATABASECHANGELOG") ||
                        upperLine.contains("DATABASECHANGELOGLOCK") ||
                        upperLine.contains("RELEASE DATABASE LOCK") ||
                        upperLine.contains("LOCK GRANTED")

                return !isMetadata
            }

            // Optional: Remove empty lines or multiple consecutive comments to keep it pretty
            String finalSql = cleanLines.join("\n").replaceAll("(?m)^\\s*\n", "")

            sqlFile.text = finalSql

            println "SUCCESS: Generated a clean SQL file containing only your business DDL."
            println "LOCATION: ${sqlFile.absolutePath}"
            println "------------------------------------------------------------"
        } else {
            throw new GradleException("ERROR: Could not find the generated SQL file at ${sqlFile.path}. Ensure 'outputFile' is set in your master activity.")
        }
    }
}

liquibase {
    activities {
        // 1. Task for the Master Database (The Registry)
        master {
            changelogFile "/auth-tenant-schema/src/main/resources/db/changelog/master/db.changelog-master.xml"

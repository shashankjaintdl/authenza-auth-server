plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'java'
}

dependencies {
    // Shared modules (auth-tenant-adapter transitively brings auth-common,
    // Spring Data JDBC, HikariCP, Redis, Jackson, and all DB drivers)
    implementation project(':auth-tenant-adapter')
    implementation project(':auth-tenant-schema')

    // Web
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Liquibase for programmatic schema migrations
    implementation 'org.liquibase:liquibase-core'

    // BCrypt password hashing for global_accounts
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // Bean validation for GlobalAccountRequest (@NotBlank, @Email, etc.)
    implementation 'org.springframework.boot:spring-boot-starter-validation'
}
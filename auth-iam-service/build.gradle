plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'java'
}

// IAM Service (Admin Dashboard)
dependencies {
    // Shared modules (auth-tenant-adapter transitively brings auth-common,
    // Spring Data JDBC, HikariCP, Redis, Jackson, validation, and all DB drivers)
    implementation project(':auth-tenant-adapter')

    // Web
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // OAuth2 Resource Server (validates JWT tokens issued by auth-server-core)
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
}

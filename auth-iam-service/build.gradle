plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'java'
}

// IAM Service (Admin Dashboard)
dependencies {
    // Shared modules (auth-tenant-adapter transitively brings auth-common,
    // Spring Data JDBC, HikariCP, Redis, Jackson, validation, and all DB drivers)
    implementation project(':auth-tenant-adapter')

    // Web
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // OAuth2 Resource Server (validates JWT tokens issued by auth-server-core)
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // TOTP (RFC 6238) — Google Authenticator-compatible MFA enrollment
    implementation 'dev.samstevens.totp:totp-spring-boot-starter:1.7.1'

    // FIDO2 / WebAuthn (W3C + CTAP2) — Passwordless biometric & hardware key authentication
    // Used for: Touch ID, Face ID, Windows Hello, YubiKey, Android biometrics
    implementation 'com.yubico:webauthn-server-core:2.5.4'

    // Jackson Datatype for WebAuthn types (ByteArray serialization)
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8'
}

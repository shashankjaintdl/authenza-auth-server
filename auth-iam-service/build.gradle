plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'java'
}

dependencies {
    // Shared modules
    implementation project(':auth-common')
    implementation project(':auth-tenant-adapter')

    // Web
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // OAuth2 Resource Server (validates JWT tokens issued by auth-server-core)
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // Data Access
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'

    // Validation for request DTOs
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Database Drivers (all supported tenant DB types)
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.oracle.database.jdbc:ojdbc8'
}

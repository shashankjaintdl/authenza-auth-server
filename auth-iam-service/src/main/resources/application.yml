server:
  port: 8082

# ──────────────────────────────────────────────
# Master Database (for loading tenant connection info)
# ──────────────────────────────────────────────
app:
  datasource:
    master:
      jdbc-url: jdbc:mysql://localhost:3306/auth-master
      username: root
      password: sjain@123
      driver-class-name: com.mysql.cj.jdbc.Driver

# ──────────────────────────────────────────────
# OAuth2 Resource Server Configuration
# Points to auth-server-core's issuer URI so this
# service can auto-discover the JWKS endpoint and
# validate JWT tokens.
# ──────────────────────────────────────────────
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081

  # ──────────────────────────────────────────────
  # Redis (for dynamic tenant provisioning events)
  # ──────────────────────────────────────────────
  data:
    redis:
      host: localhost
      port: 6379

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="'Login — ' + ${tenantId}">Login</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #e0e0e0;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            backdrop-filter: blur(16px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .login-card h1 {
            font-size: 1.6rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: .25rem;
        }

        .tenant-badge {
            display: block;
            text-align: center;
            font-size: .85rem;
            color: #a78bfa;
            margin-bottom: 1.75rem;
        }

        .error-msg {
            background: rgba(239, 68, 68, .15);
            border: 1px solid rgba(239,68,68,.3);
            color: #fca5a5;
            padding: .65rem 1rem;
            border-radius: 8px;
            font-size: .85rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .logout-msg {
            background: rgba(34, 197, 94, .15);
            border: 1px solid rgba(34,197,94,.3);
            color: #86efac;
            padding: .65rem 1rem;
            border-radius: 8px;
            font-size: .85rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .form-group {
            margin-bottom: 1.25rem;
            position: relative;
        }

        label {
            display: block;
            font-size: .8rem;
            font-weight: 500;
            margin-bottom: .35rem;
            color: #c4b5fd;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: .7rem 1rem;
            border: 1px solid rgba(255,255,255,.15);
            border-radius: 8px;
            background: rgba(255,255,255,.06);
            color: #f1f1f1;
            font-size: .95rem;
            outline: none;
            transition: border-color .2s;
        }

        input:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
        }

        input.input-valid {
            border-color: rgba(34, 197, 94, 0.5);
        }

        input.input-error {
            border-color: rgba(239, 68, 68, 0.5);
        }

        .field-feedback {
            font-size: .78rem;
            margin-top: .3rem;
            min-height: 1.1rem;
            color: #fca5a5;
            transition: opacity .2s;
            opacity: 0;
        }

        .field-feedback.show {
            opacity: 1;
        }

        button {
            width: 100%;
            padding: .75rem;
            margin-top: .5rem;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity .2s;
        }

        button:hover:not(:disabled) { 
            opacity: .9; 
            transform: translateY(-1px);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .signup-link {
            display: block;
            text-align: center;
            margin-top: 1.25rem;
            font-size: .85rem;
            color: #9ca3af;
        }

        .signup-link a {
            color: #a78bfa;
            text-decoration: none;
            font-weight: 500;
            transition: color .2s;
        }

        .signup-link a:hover {
            color: #c4b5fd;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h1>Sign In</h1>
    <span class="tenant-badge" th:text="${tenantId}">tenant</span>

    <div class="error-msg" th:if="${param.error}">
        Invalid username or password.
    </div>
    <div class="logout-msg" th:if="${param.logout}">
        You have been signed out.
    </div>

    <form th:action="@{'/' + ${tenantId} + '/login'}" method="post">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autocomplete="username" autofocus required/>
            <div id="usernameFeedback" class="field-feedback">Username is required</div>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required/>
            <div id="passwordFeedback" class="field-feedback">Password is required</div>
        </div>

        <button type="submit" id="submitBtn" disabled>Sign in</button>
    </form>

    <p class="signup-link">
        Don't have an account?
        <a th:href="@{'/' + ${tenantId} + '/register'}">Create Account</a>
    </p>
</div>

<script>
(function() {
    'use strict';

    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submitBtn');
    const usernameFeedback = document.getElementById('usernameFeedback');
    const passwordFeedback = document.getElementById('passwordFeedback');

    function validateField(inputEl, feedbackEl) {
        if (!inputEl.value.trim()) {
            inputEl.classList.remove('input-valid');
            inputEl.classList.add('input-error');
            feedbackEl.classList.add('show');
            return false;
        } else {
            inputEl.classList.remove('input-error');
            inputEl.classList.add('input-valid');
            feedbackEl.classList.remove('show');
            return true;
        }
    }

    function checkFormState() {
        // Simple check to enable/disable button
        const isUserValid = !!usernameInput.value.trim();
        const isPassValid = !!passwordInput.value;
        submitBtn.disabled = !(isUserValid && isPassValid);
    }

    usernameInput.addEventListener('input', function() {
        if (usernameInput.classList.contains('input-error')) {
            validateField(usernameInput, usernameFeedback);
        }
        checkFormState();
    });

    passwordInput.addEventListener('input', function() {
        if (passwordInput.classList.contains('input-error')) {
            validateField(passwordInput, passwordFeedback);
        }
        checkFormState();
    });

    usernameInput.addEventListener('blur', function() {
        validateField(usernameInput, usernameFeedback);
    });

    passwordInput.addEventListener('blur', function() {
        validateField(passwordInput, passwordFeedback);
    });

    // Check on load in case of browser auto-fill
    setTimeout(checkFormState, 100);
})();
</script>

</body>
</html>

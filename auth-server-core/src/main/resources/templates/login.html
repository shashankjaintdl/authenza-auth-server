<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="'Login — ' + ${tenantId}">Login</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #e0e0e0;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            backdrop-filter: blur(16px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .login-card h1 {
            font-size: 1.6rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: .25rem;
        }

        .tenant-badge {
            display: block;
            text-align: center;
            font-size: .85rem;
            color: #a78bfa;
            margin-bottom: 1.75rem;
        }

        .error-msg {
            background: rgba(239, 68, 68, .15);
            border: 1px solid rgba(239,68,68,.3);
            color: #fca5a5;
            padding: .65rem 1rem;
            border-radius: 8px;
            font-size: .85rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .logout-msg {
            background: rgba(34, 197, 94, .15);
            border: 1px solid rgba(34,197,94,.3);
            color: #86efac;
            padding: .65rem 1rem;
            border-radius: 8px;
            font-size: .85rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        label {
            display: block;
            font-size: .8rem;
            font-weight: 500;
            margin-bottom: .35rem;
            color: #c4b5fd;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: .7rem 1rem;
            margin-bottom: 1rem;
            border: 1px solid rgba(255,255,255,.15);
            border-radius: 8px;
            background: rgba(255,255,255,.06);
            color: #f1f1f1;
            font-size: .95rem;
            outline: none;
            transition: border-color .2s;
        }

        input:focus {
            border-color: #7c3aed;
        }

        button {
            width: 100%;
            padding: .75rem;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity .2s;
        }

        button:hover { opacity: .9; }
    </style>
</head>
<body>

<div class="login-card">
    <h1>Sign In</h1>
    <span class="tenant-badge" th:text="${tenantId}">tenant</span>

    <div class="error-msg" th:if="${param.error}">
        Invalid username or password.
    </div>
    <div class="logout-msg" th:if="${param.logout}">
        You have been signed out.
    </div>

    <form th:action="@{'/' + ${tenantId} + '/login'}" method="post">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" autofocus required/>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required/>

        <button type="submit">Sign in</button>
    </form>
</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Change your password" />
    <title th:text="'Change Password — ' + ${tenantId}">Change Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            background-color: #1A1A1E;
            color: #e0e0e0;
            overflow-x: hidden;
        }

        .split-layout {
            display: flex;
            min-height: 100vh;
            width: 100%;
        }

        /* ─── Left Form Section ─── */
        .form-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
        }

        .form-container {
            width: 100%;
            max-width: 380px;
            animation: fadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .form-container h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: .25rem;
            color: #ffffff;
            letter-spacing: -0.025em;
        }

        .form-container p.subtitle {
            font-size: .95rem;
            color: #a1a1aa;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .tenant-badge {
            display: inline-block;
            font-size: .8rem;
            color: #a78bfa;
            background: rgba(167, 139, 250, 0.1);
            padding: .2rem .75rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            font-weight: 500;
        }

        /* ─── Messages ─── */
        .error-msg {
            background: rgba(239, 68, 68, .1);
            border-left: 3px solid #ef4444;
            color: #fca5a5;
            padding: .75rem 1rem;
            border-radius: 8px;
            font-size: .875rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
            text-align: center;
            animation: shakeFade .5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shakeFade {
            0%, 100% { transform: translateX(0); opacity: 1; }
            20%, 60% { transform: translateX(-4px); }
            40%, 80% { transform: translateX(4px); }
            0% { opacity: 0; }
        }

        /* ─── Form ─── */
        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        label {
            display: block;
            font-size: .85rem;
            font-weight: 500;
            margin-bottom: .25rem;
            color: #9ca3af;
        }

        input[type="password"] {
            width: 100%;
            padding: .65rem 0;
            border: none;
            border-bottom: 1px solid #3f3f46;
            background: transparent;
            color: #f8fafc;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-bottom-color: #8b5cf6;
        }

        /* ─── Password match ─── */
        .password-feedback {
            font-size: .8rem;
            margin-top: .4rem;
            min-height: 1.2rem;
            transition: opacity .2s ease;
            font-weight: 500;
        }

        .password-feedback.match { color: #22c55e; }
        .password-feedback.mismatch { color: #ef4444; }

        /* ─── Buttons ─── */
        .btn-submit {
            display: inline-block;
            width: 100%;
            padding: .85rem;
            border: none;
            border-radius: 8px;
            background: #8b5cf6;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 1rem;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.25);
            text-align: center;
            text-decoration: none;
        }

        .btn-submit:hover:not(:disabled) {
            background: #7c3aed;
            box-shadow: 0 6px 16px rgba(139, 92, 246, 0.4);
            transform: translateY(-1px);
        }

        .btn-submit:active:not(:disabled) { transform: translateY(0); }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #3f3f46;
            box-shadow: none;
        }

        /* ─── Links ─── */
        .back-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: .9rem;
            color: #a1a1aa;
        }

        .back-link a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            margin-left: .25rem;
            border-bottom: 1px solid transparent;
            transition: all .2s;
        }

        .back-link a:hover { border-bottom-color: #ffffff; }

        /* ─── Right Hero Section ─── */
        .hero-section {
            flex: 1.2;
            background: linear-gradient(135deg, #7c3aed 0%, #4c1d95 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem;
            position: relative;
            overflow: hidden;
            color: #ffffff;
        }

        .hero-section::before, .hero-section::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            z-index: 0;
            animation: float 10s ease-in-out infinite alternate;
        }
        .hero-section::before {
            width: 400px; height: 400px;
            background: #a78bfa;
            top: -100px; right: -100px;
            animation-delay: 0s;
        }
        .hero-section::after {
            width: 300px; height: 300px;
            background: #c4b5fd;
            bottom: -50px; left: -50px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(30px) scale(1.05); }
        }

        .hero-content {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 500px;
        }

        .hero-content h2 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            letter-spacing: -0.025em;
        }

        .hero-content p {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 3rem;
            line-height: 1.6;
        }

        .hero-image {
            width: 100%;
            max-width: 450px;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        .hero-image:hover { transform: translateY(-5px); }

        /* Responsive Layout */
        @media (max-width: 900px) {
            .hero-section { display: none; }
            .form-section { padding: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="split-layout">
        <!-- ─── Left Form Section ─── -->
        <div class="form-section">
            <div class="form-container">

                <span class="tenant-badge" th:text="${tenantId}">tenant</span>
                <h1>Change Password</h1>
                <p class="subtitle">Your administrator has requested that you change your password before continuing.</p>

                <!-- Inline error from validation -->
                <div class="error-msg" th:if="${error}" th:text="${error}">
                    An error occurred.
                </div>

                <form th:action="@{'/' + ${tenantId} + '/force-password-change'}" method="post" id="resetForm">

                    <!-- New Password -->
                    <div class="form-group">
                        <label for="newPassword">New Password</label>
                        <input type="password" id="newPassword" name="newPassword"
                            autocomplete="new-password" required autofocus />
                    </div>

                    <!-- Confirm New Password -->
                    <div class="form-group">
                        <label for="confirmPassword">Confirm New Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword"
                            autocomplete="new-password" required />
                        <div id="passwordFeedback" class="password-feedback"></div>
                    </div>

                    <button type="submit" class="btn-submit" id="submitBtn">Update Password</button>
                </form>

                <p class="back-link">
                    Not you?
                    <a th:href="@{'/' + ${tenantId} + '/login?logout'}">Sign in as another user</a>
                </p>

            </div>
        </div>

        <!-- ─── Right Hero Section ─── -->
        <div class="hero-section">
            <div class="hero-content">
                <h2>Welcome to Authenza</h2>
                <p>Please secure your account with a strong, memorable password to complete your login.</p>
                <img src="/images/auth-illustration.png" alt="Secure Authenza Access" class="hero-image" />
            </div>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        var passwordInput = document.getElementById('newPassword');
        var confirmInput = document.getElementById('confirmPassword');
        var submitBtn = document.getElementById('submitBtn');
        var passwordFeedback = document.getElementById('passwordFeedback');

        if (!passwordInput || !confirmInput || !submitBtn) return;

        function checkPasswordMatch() {
            var pass = passwordInput.value;
            var confirm = confirmInput.value;

            if (!confirm) {
                passwordFeedback.textContent = '';
                passwordFeedback.className = 'password-feedback';
                return false;
            } else if (pass === confirm) {
                passwordFeedback.textContent = 'Passwords match';
                passwordFeedback.className = 'password-feedback match';
                return true;
            } else {
                passwordFeedback.textContent = 'Passwords do not match';
                passwordFeedback.className = 'password-feedback mismatch';
                return false;
            }
        }

        function updateSubmitState() {
            var hasPassword = passwordInput.value.length >= 8;
            var matches = checkPasswordMatch();
            submitBtn.disabled = !(hasPassword && matches);
        }

        passwordInput.addEventListener('input', updateSubmitState);
        confirmInput.addEventListener('input', updateSubmitState);

        // Initial state
        updateSubmitState();
    })();
    </script>
</body>
</html>

server:
  port: 8081


logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
    org.springframework: DEBUG
    org.springframework.security.oauth2.server.authorization.oidc: TRACE
    org.springframework.security.oauth2.server.authorization.authentication: TRACE

spring:
  data:
    redis:
      host: localhost
      port: 6379

app:
  datasource:
    master:
      jdbc-url: jdbc:mysql://localhost:3306/auth-master?createDatabaseIfNotExist=true
      username: root
      password: sjain@123
      driver-class-name: com.mysql.cj.jdbc.Driver
      maximum-pool-size: 10
      minimum-idle: 2
  super-admin-client:
    enabled: true
    client-id: super-admin-client
    client-name: "Super Admin Client"
    client-secret: super-admin-secret
    tenant-id: system-admin
    scopes: openid,profile,system:admin,tenant:manage
    redirect-uris: http://localhost:8080/login/oauth2/code/super-admin,http://127.0.0.1:4200,http://localhost:4200
    post-logout-redirect-uris: http://localhost:8080/
    grant-types: authorization_code,refresh_token,client_credentials
    authentication-methods: client_secret_basic
    require-consent: false
    require-proof-key: false
  brute-force:
    # Lock account after this many consecutive failed login attempts
    max-attempts: 5
    # Duration (in minutes) for which a locked account remains inaccessible
    lock-duration-minutes: 15

  security:
    session:
      # Default session active time. Can be overridden in DB (tenant_settings)
      default-ttl-days: 30

  mfa:
    # AES-256-GCM key (base64-encoded, must decode to exactly 32 bytes).
    # Generate a production key with: openssl rand -base64 32
    # WARNING: This dev key is insecure — rotate before deploying to production!
    encryption-key: "bQT4Q2jU7KEI4Z3DjRUCnkWPwkDmkgoZLwk8ydbGYXc="

  services:
    iam:
      base-url: http://localhost:8082
    tenant-portal-url: http://127.0.0.1:4200
  # Ensure standard auto-config doesn't interfere
#  jdbc:
#    template:
#      enabled: false
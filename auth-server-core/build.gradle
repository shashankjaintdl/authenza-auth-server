plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'java'
}

dependencies {
    // Shared modules (auth-tenant-adapter transitively brings auth-common,
    // Spring Data JDBC, HikariCP, Redis, Jackson, validation, and all DB drivers)
    implementation project(':auth-tenant-adapter')

    // Spring Authorization Server (includes spring-security and nimbus-jose-jwt transitively)
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-authorization-server'

    // Web & Templating
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // Java 8 Date/Time serialization support for JWT claims
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
}
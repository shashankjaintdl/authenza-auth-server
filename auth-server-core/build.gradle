plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'java'
}

dependencies {
    // Shared modules
    implementation project(':auth-common')
    implementation project(':auth-tenant-adapter')

    // Spring Authorization Server (includes spring-boot-starter-security and nimbus-jose-jwt transitively)
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-authorization-server'

    // Data Access
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'

    // Web & Templating
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // Java 8 Date/Time serialization support for JWT claims
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // Database Drivers (all supported tenant DB types)
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.oracle.database.jdbc:ojdbc8'
}
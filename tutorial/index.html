<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Authenza Tutorial</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Authenza engineer tutorial — book-style guide" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  <style>
    :root { --base-font-size: 16px; }
    .app-name-link { font-weight: 600; }
  </style>
</head>
<body>
  <div id="app">Loading Authenza Tutorial…</div>
  <script>
    // Project Pages: https://<user>.github.io/authenza-auth-server/tutorial/
    // Local: npx --yes serve tutorial  → http://localhost:3000
    // Do NOT open index.html via file:// — Docsify cannot load .md files that way (404).
    (function () {
      var path = location.pathname || '/';
      var basePath = '/';
      if (path.indexOf('/authenza-auth-server/tutorial') !== -1) {
        basePath = '/authenza-auth-server/tutorial/';
      } else if (path.indexOf('/tutorial') !== -1) {
        // e.g. local reverse-proxy or nested serve
        var idx = path.indexOf('/tutorial');
        basePath = path.substring(0, idx + '/tutorial'.length) + '/';
      }

      window.$docsify = {
        name: 'Authenza Tutorial',
        repo: 'https://github.com/shashankjaintdl/authenza-auth-server',
        homepage: 'README.md',
        basePath: basePath,
        loadSidebar: true,
        subMaxLevel: 2,
        auto2top: true,
        relativePath: false,
        notFoundPage: false,
        search: {
          placeholder: 'Search tutorial',
          noData: 'No results',
          depth: 3,
          pathNamespaces: ['/']
        },
        pagination: {
          previousText: 'Previous',
          nextText: 'Next',
          crossChapter: true
        }
      };
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
</body>
</html>

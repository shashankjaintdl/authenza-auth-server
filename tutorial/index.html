<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Authenza Tutorial</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Authenza engineer tutorial — book-style guide" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  <style>
    :root {
      --base-font-size: 16px;
    }
    .app-name-link { font-weight: 600; }
  </style>
</head>
<body>
  <div id="app">Loading Authenza Tutorial…</div>
  <script>
    window.$docsify = {
      name: 'Authenza Tutorial',
      repo: 'https://github.com/shashankjaintdl/authenza-auth-server',
      homepage: 'README.md',
      // Project Pages live under /<repo>/tutorial/
      basePath: (function () {
        var path = location.pathname;
        if (path.endsWith('/')) return path;
        if (path.endsWith('index.html')) return path.replace(/index\.html$/, '');
        return path.replace(/\/[^/]*$/, '/');
      })(),
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      relativePath: true,
      search: {
        placeholder: 'Search tutorial',
        noData: 'No results',
        depth: 3
      },
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true
      },
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
</body>
</html>
